[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobmatch-data"
version = "0.1.0"
description = "Historical job posting ingestion for JobMatch"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=2.10"]

[project.scripts]
jobmatch-data = "jobmatch_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobmatch_data = ["match.html", "latest.html", "assets/*.mjs", "assets/*.txt"]
